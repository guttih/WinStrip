; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
;monitor_speed = 500000
lib_deps = fastled/FastLED@^3.5.0
build_flags = -DCORE_DEBUG_LEVEL=0

; USB is reserved for logs; controller commands use Bluetooth in this build.
[env:esp32dev-usb-debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSTRIP_USB_DEBUG=1

; Recovery/compatibility build without the Bluetooth stack.
[env:esp32dev-usb-only]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSTRIP_ENABLE_BLUETOOTH=0
